    effect: "lê o arquivo de entrada fornecido"
    must_preserve: true
  - source_loc: "BigData-Mavem/src/main/java/org/countWords/Main.java:35"
    effect: "cria a saída Hadoop no diretório informado"
    must_preserve: true
branches:
